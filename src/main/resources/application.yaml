spring:
  application:
    name: PI-mecado-preso
  datasource:
    url: jdbc:postgresql://localhost:5432/Mercado-Preso
    username: postgres
    password: 123456789
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
logging:
  level:
    org:
      hibernate:
        sql: DEBUG
        orm:
          jdbc:
            bind: TRACE
